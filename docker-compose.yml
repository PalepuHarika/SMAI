version: '3.8'

services:
  # 1. Local AI Model (Ollama)
  ollama:
    image: ollama/ollama:latest
    container_name: scanner_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Automatically start server and pull the required Qwen model
    entrypoint: >
      /bin/sh -c "ollama serve & sleep 5 && ollama pull qwen2.5-coder:1.5b && wait"

  # 2. FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: scanner_backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_URL=http://ollama:11434
    depends_on:
      - ollama

  # 3. React Frontend (Vite + Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: scanner_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  ollama_data:
